name: build gpu image
on:
  push:
    branches: [main]
    paths: [Dockerfile.gpu, remotion-package.json, .github/workflows/build-gpu.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: free disk space (the image is ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ghcr.io/mdalkhen/aadi-runtime:gpu
